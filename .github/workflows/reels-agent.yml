name: Reels agent

on:
  schedule:
    - cron: "17 * * * *"   # svaki sat (UTC)
  workflow_dispatch:
    inputs:
      force_post:
        description: "Objavi odmah sljedeći video (ignoriše raspored)"
        type: boolean
        default: false
      dry_run:
        description: "Probni rad: napiši caption, ali ne objavljuj i ne šalji email"
        type: boolean
        default: false
      diagnose:
        description: "Dijagnostika Instagram uploada (ništa ne objavljuje)"
        type: boolean
        default: false

concurrency:
  group: reels-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q -r requirements.txt
      - name: Instaliraj Claude Code (caption preko pretplate)
        run: npm install -g @anthropic-ai/claude-code > /dev/null
      - name: Pokreni agenta
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          EMAIL_TO: anel@webmajstor.ba
          DRIVE_FOLDER_IDS: 1giL5P5RS1Sm13DWMtXP4UTorlkxdJzNo,1rREvRpZqFoNP2bfNEVpXN0640sRnXsvB
          CAPTION_CONTEXT: ${{ vars.CAPTION_CONTEXT }}
          FORCE_POST: ${{ inputs.force_post && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          if [ "${{ inputs.diagnose }}" = "true" ]; then python inspect_media.py; python diagnose.py; else python agent.py; fi
      - name: Sačuvaj stanje
        if: always() && inputs.dry_run != true && inputs.diagnose != true
        run: |
          git config user.name "reels-agent"
          git config user.email "reels-agent@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git push)
